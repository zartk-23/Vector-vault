[project]
name = "vectorvault"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "asyncpg>=0.29", "psycopg[binary]>=3.2", "alembic>=1.13", "pydantic-settings>=2.4", "pyjwt>=2.9", "pwdlib[argon2]>=0.2", "python-multipart>=0.0.9", "pypdf>=5.0", "redis>=5.0", "pinecone>=5.0", "openai>=1.40", "prometheus-client>=0.20"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# The initial codebase uses deliberately compact formatting. Keep CI focused on
# syntax/undefined-name defects until the dedicated formatting pass lands.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
