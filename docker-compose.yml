services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_DB: vectorvault, POSTGRES_USER: vectorvault, POSTGRES_PASSWORD: vectorvault}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U vectorvault"], interval: 5s, timeout: 3s, retries: 10}
  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
